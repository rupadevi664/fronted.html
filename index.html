
<!DOCTYPE html>
<html lang="en">
<head>
    <title>OTP Generator</title>
</head>
<body>
    <h2>OTP Generator</h2>

    <button id="otpBtn" onclick="otpHandling()">
        Generate OTP
    </button>

    <script>
        let count = 0;
        let interval;

        function generateOTP() {
            const otp = Math.floor(100000 + Math.random() * 900000);
            console.log("OTP:", otp);
            count++;

            if (count === 5) {
                clearInterval(interval);

                document.getElementById("otpBtn").disabled = true;

                alert("Your limit is over! Only 5 OTPs are allowed.");
            }
        }

        function otpHandling() {
            const btn = document.getElementById("otpBtn");

            // Prevent multiple clicks
            btn.disabled = true;

            // First OTP immediately after clicking
            generateOTP();

            // Generate remaining OTPs every 30 seconds
            if (count < 5) {
                interval = setInterval(() => {
                    generateOTP();
                }, 30000);
            }
        }
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <title>OTP Generator</title>
</head>
<body>
    <h2>OTP Generator</h2>

    <button id="otpBtn" onclick="otpHandling()">
        Generate OTP
    </button>

    <p id="message"></p>

    <script>
        let count = 0;
        let interval;

        function generateOTP() {
            const otp = Math.floor(100000 + Math.random() * 900000);
            console.log("OTP:", otp);

            count++;

            if (count === 5) {
                clearInterval(interval);

                document.getElementById("otpBtn").disabled = true;
                document.getElementById("message").textContent =
                    "Your limit is over! Button disabled.";
            }
        }

        function otpHandling() {
            const btn = document.getElementById("otpBtn");

            // Prevent multiple clicks
            btn.disabled = true;

            // First OTP immediately
            generateOTP();

            // Remaining OTPs every 30 seconds
            if (count < 5) {
                interval = setInterval(generateOTP, 30000);
            }
        }
    </script>
</body>
</html>
